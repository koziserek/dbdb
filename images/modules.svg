<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 880" width="1040" height="880" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<title id="t">How the parts of dbdb fit together</title>
<desc id="d">People, scripts and AI assistants use two programs, dbdb-app and dbdb-cli. Both are built on three libraries: dbdb-assist for assistants, which asks the models through connectors; dbdb-sync for keeping open copies of a project the same; and dbdb-core, the engine, which reads and writes files and databases and reads REST APIs and OData services, each through a source's own connection or one kept in Connectors. dbdb-sync reaches the other copies of a project three ways: through a sync folder, through a relay, and through a direct link from copy to copy. Changes, runs asked of another machine and pushed files travel there.</desc>
