.ln{stroke:#7b7f86;stroke-width:1.5;fill:none} .lns{stroke:#1f6f78;stroke-width:1.5;fill:none} .ah{fill:#7b7f86} .ahs{fill:#1f6f78}
.lab{font-size:11px;font-weight:650;letter-spacing:.08em;fill:#62666d}
